tasks.named("test") {
	// This source set contains a standalone executable verifier, not a JUnit/TestNG class.
	failOnNoDiscoveredTests = false
}

tasks.named("check") {
	dependsOn tasks.named("verifyAlexsCavesHeldItemTransforms")
	dependsOn tasks.named("verifyHeldItemPresentations")
	dependsOn tasks.named("verifyArmorEnchantability")
	dependsOn tasks.named("verifyEquipmentPresentations")
	dependsOn tasks.named("verifyGliderFallbacks")
	dependsOn tasks.named("verifyFluidModels")
	dependsOn tasks.named("verifyReadableRegistryData")
	dependsOn tasks.named("verifyBlockSyncSafety")
	dependsOn tasks.named("verifyModBiomeLight")
	dependsOn tasks.named("verifyEntityModelAnimation")
	dependsOn tasks.named("verifyNuclearFurnaceUi")
	dependsOn tasks.named("verifyAutomaticMenuLayout")
	dependsOn tasks.named("verifyImbuingUi")
	dependsOn tasks.named("verifyBorrowedEchoPresentation")
	dependsOn tasks.named("verifyMapDecorationFallbacks")
	dependsOn tasks.named("verifyClientSafeStats")
	dependsOn tasks.named("verifyNeverendPresentation")
	dependsOn tasks.named("verifyPackSplitting")
}

loom {
    accessWidenerPath = file("src/main/resources/polymer-patcher.classtweaker")

    // Nothing to translate through on an unobfuscated Minecraft
    noIntermediateMappings()
}

java {
	// No sources jar: remapping one needs an intermediary namespace, and 26.2 has none to map through

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
