plugins {
	id "fabric-loom"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url "https://maven.theepicblock.nl"
		content { includeGroup("nl.theepicblock") }
	}
	maven { url 'https://maven.nucleoid.xyz/releases' }
	mavenLocal()
}

// The same empty mappings the root project explains at length: 26.2 is unobfuscated, so there is
// nothing to rename, but loom will not configure without being handed something.
def identityMappings = layout.buildDirectory.file("unobfuscated-mappings.tiny").get().asFile
identityMappings.parentFile.mkdirs()
identityMappings.text = "tiny\t2\t0\tofficial\tintermediary\tnamed\n"

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		mappings(identityMappings)
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation include("nl.theepicblock:resource-locator-api:${project.resource_locator_version}")

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "eu.pb4:polymer-core:${project.polymer_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		// Evaluated while the copy runs, after the root build has allocated this jar's version.
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

loom {
	accessWidenerPath = file("src/main/resources/polymer-patcher-client-dump.classtweaker")

	// Nothing to translate through on an unobfuscated Minecraft
	noIntermediateMappings()
}

java {
	// No sources jar: remapping one needs an intermediary namespace, and 26.2 has none to map through

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
